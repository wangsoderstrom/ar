<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <link rel="icon" href="data:,">
  <title>Et skjult lag</title>
  <script>
    // Hämta alltid senaste versionen av stil och kod (GitHub Pages cachar annars i 10 min)
    window.__v = Date.now();
    document.write('<link rel="stylesheet" href="style.css?v=' + window.__v + '">');
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three/three.module.js",
      "three/addons/": "./libs/three/addons/"
    }
  }
  </script>
</head>
<body>
  <!-- AR-vy (kamera + 3D) -->
  <div id="ar"></div>

  <!-- Startskärm -->
  <section id="start" class="screen">
    <div class="card">
      <h1 data-t="title">Et skjult lag</h1>
      <p data-t="intro">Ret telefonens kamera mod kunstværket for at se det, der gemmer sig under overfladen.</p>
      <button id="btn-start" class="primary" data-t="start">Start</button>
      <button id="btn-nocam" class="ghost" data-t="noCamera">Se uden kamera</button>
      <p class="small" data-t="privacy">Kameraet bruges kun på din telefon. Der gemmes eller sendes ingen billeder.</p>
      <p id="error" class="error" hidden></p>
    </div>
  </section>

  <!-- Laddar -->
  <section id="loading" class="screen" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p data-t="loading">Indlæser …</p>
  </section>

  <!-- Sökhjälp medan kameran letar efter verket -->
  <div id="scan" hidden>
    <div class="frame" aria-hidden="true"><img id="guide" alt="" hidden><i></i><i></i><i></i><i></i></div>
    <p data-t="scan">Ret kameraet mod værket</p>
  </div>

  <!-- Kontroller under AR -->
  <div id="controls" hidden>
    <button id="btn-sound" class="pill"></button>
  </div>

  <!-- Reservläge: bara videon, ingen kamera -->
  <section id="fallback" class="screen" hidden>
    <video id="fallback-video" controls playsinline preload="metadata"></video>
    <canvas id="fallback-canvas" hidden></canvas>
    <button id="btn-fb-sound" class="pill" hidden></button>
    <button id="btn-close" class="ghost" data-t="close">Luk</button>
  </section>

  <!-- Videokälla för AR (dold, används som textur) -->
  <video id="ar-video" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous" hidden></video>

  <script type="module">
    import("./app.js?v=" + window.__v).catch((e) => {
      console.error(e);
      const el = document.getElementById("error");
      el.textContent = "Teknisk fejl: " + e.message + " (kontrollér config.js)";
      el.hidden = false;
      document.getElementById("btn-start").disabled = true;
    });
  </script>
</body>
</html>
